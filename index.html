<!DOCTYPE html>
<html lang="pt" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quiz Português</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
    <script>
        // Apply saved theme before first paint to avoid flash
        (function() {
            const t = localStorage.getItem('theme');
            if (t) document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
</head>
<body>
<button id="theme-toggle" aria-label="Mudar para modo claro">☀</button>

<div id="main-container">
    <h1>Bem-vindo ao Quiz de Português!</h1>

    <div id="stats-bar">
        <span id="streak-display" class="hidden"></span>
        <span id="mastered-display" class="hidden"></span>
    </div>

    <div id="goal-section" class="hidden">
        <div id="goal-progress-bar-wrap">
            <div id="goal-progress-bar"></div>
        </div>
        <p id="goal-label"></p>
    </div>

    <div id="goal-form">
        <p class="setup-hint">Defina uma meta pessoal (opcional):</p>
        <div id="goal-inputs">
            <input type="number" id="goal-target" min="1" max="2000" placeholder="N.º itens" aria-label="Número de itens a dominar">
            <span>itens em</span>
            <input type="number" id="goal-days" min="1" max="365" placeholder="Dias" aria-label="Dias para atingir a meta">
            <span>dias</span>
            <button id="goal-save">Guardar meta</button>
        </div>
    </div>

    <div id="button-container">
        <button id="btn-verbs">Praticar Conjugação de Verbos</button>
        <button id="btn-vocab">Praticar Vocabulário</button>
        <button id="btn-gender">Praticar Género e Plural</button>
    </div>
</div>

<div id="footer">
    <a id="support-link" href="https://buymeacoffee.com/ktouchie" target="_blank" rel="noopener noreferrer">
        Compre-me um pastel de nata
    </a>
    <div id="version-container">
        Version: <span id="version"></span>
    </div>
</div>

<script type="module">
    import { loadVersion, initTheme } from './common.js';
    import { loadStreak, getTotalMastered, loadGoal, saveGoal, getGoalProgress } from './gamification.js';

    initTheme();
    loadVersion();

    // Streak display
    const streak = loadStreak();
    if (streak.currentStreak > 0) {
        const el = document.getElementById('streak-display');
        el.textContent = `🔥 ${streak.currentStreak} dia${streak.currentStreak > 1 ? 's' : ''} seguido${streak.currentStreak > 1 ? 's' : ''}`;
        el.classList.remove('hidden');
    }

    // Mastered items display
    const mastered = getTotalMastered();
    if (mastered > 0) {
        const el = document.getElementById('mastered-display');
        el.textContent = `${mastered} item${mastered > 1 ? 'ns' : ''} dominado${mastered > 1 ? 's' : ''}`;
        el.classList.remove('hidden');
    }

    // Goal display
    const goal = loadGoal();
    if (goal) {
        const { mastered: m, daysLeft, pct } = getGoalProgress(goal);
        const section = document.getElementById('goal-section');
        section.classList.remove('hidden');
        document.getElementById('goal-progress-bar').style.width = pct + '%';
        document.getElementById('goal-label').textContent =
            `Meta: ${m}/${goal.target} itens (${pct}%) — ${daysLeft} dia${daysLeft !== 1 ? 's' : ''} restante${daysLeft !== 1 ? 's' : ''}`;
    }

    // Goal form
    document.getElementById('goal-save').addEventListener('click', () => {
        const target = parseInt(document.getElementById('goal-target').value, 10);
        const days = parseInt(document.getElementById('goal-days').value, 10);
        if (!target || !days || target < 1 || days < 1) {
            alert('Introduza valores válidos para a meta.');
            return;
        }
        saveGoal(target, days);
        location.reload();
    });

    document.getElementById('btn-verbs').addEventListener('click', () => location.href = 'verb_quiz.html');
    document.getElementById('btn-vocab').addEventListener('click', () => location.href = 'vocabulary_quiz.html');
    document.getElementById('btn-gender').addEventListener('click', () => location.href = 'gender_quiz.html');
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Quiz Português</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/x-icon" href="/images/barcelos.png">
</head>
<body>
<div id="main-container">
    <h1>Bem-vindo ao Quiz de Português!</h1>
    <div id="button-container">
        <!-- Button to access the verb quiz -->
        <button onclick="location.href='verb_quiz.html'">Praticar Conjugação de Verbos</button>
        <!-- Button to access the vocabulary quiz -->
        <button onclick="location.href='vocabulary_quiz.html'">Praticar Vocabulário</button>
    </div>
</div>
<div id="footer">
    <a id="support-link" href="https://buymeacoffee.com/ktouchie" target="_blank" rel="noopener noreferrer">
        Buy me a pastel de nata
    </a>
    <div id="version-container">
        Version: <span id="version">1.0.0</span>
    </div>
</div>
<script>
    fetch('/version.txt') // Ensure the correct relative path
        .then(response => {
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            return response.text();
        })
        .then(version => {
            const versionElement = document.getElementById('version');
            if (versionElement) {
                versionElement.textContent = `Version: ${version.trim()}`;
            } else {
                console.error('Version element not found in the DOM.');
            }
        })
        .catch(err => {
            console.error('Error fetching version:', err);
            const versionElement = document.getElementById('version');
            if (versionElement) {
                versionElement.textContent = 'Version: Error';
            }
        });
</script>
</body>
</html>

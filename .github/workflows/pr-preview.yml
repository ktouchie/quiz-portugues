name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Checkout gh-pages storage
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: .pages-storage

      - name: Copy PR preview files into storage
        run: |
          DEST=".pages-storage/previews/pr-${{ github.event.pull_request.number }}"
          mkdir -p "$DEST"
          rsync -av \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.pages-storage/' \
            --exclude='node_modules/' \
            ./ "$DEST/"

      - name: Commit and push storage to gh-pages
        run: |
          cd .pages-storage
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Add preview for PR #${{ github.event.pull_request.number }}"
          git push origin gh-pages

      - name: Remove .git before upload
        run: rm -rf .pages-storage/.git

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        # The uploaded artifact is only a handoff to deploy-pages below; the real durable copy is
        # the commit just pushed to gh-pages. Keep it around only briefly to avoid needlessly
        # consuming the account's Actions-artifact storage quota, and don't let a failed upload
        # (e.g. while the account is over quota) skip the actual deploy step that follows.
        continue-on-error: true
        with:
          path: .pages-storage
          retention-days: 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = '<!-- pr-preview-link -->';
            const isUserOrOrgPagesRepo =
              context.repo.repo.toLowerCase() === `${context.repo.owner.toLowerCase()}.github.io`;
            const basePath = isUserOrOrgPagesRepo ? '' : `/${context.repo.repo}`;
            const previewUrl = `https://${context.repo.owner}.github.io${basePath}/previews/pr-${context.issue.number}/`;
            const body = `${marker}\n🔎 **Preview URL**\n\n${previewUrl}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find((comment) =>
              comment.user.type === 'Bot' && comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

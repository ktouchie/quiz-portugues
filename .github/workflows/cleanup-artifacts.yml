name: Cleanup old Actions artifacts

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-artifacts.yml"

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete every artifact currently stored for this repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/actions/artifacts" --paginate --jq '.artifacts[].id' | \
          while read -r id; do
            echo "Deleting artifact $id"
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
          done

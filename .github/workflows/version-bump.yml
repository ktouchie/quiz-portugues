name: Version Bump and Deploy

on:
  push:
    branches:
      - main

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Read Current Version
        id: read-version
        run: |
          if [[ -f version.txt ]]; then
            version=$(cat version.txt)
            echo "current_version=$version" >> $GITHUB_ENV
          else
            echo "current_version=0.0.0" >> $GITHUB_ENV
          fi

      - name: Detect Manual Version Change
        id: detect-manual-change
        run: |
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            git diff HEAD~1 HEAD -- version.txt > version_diff.txt
          else
            touch version_diff.txt
          fi
          if [[ -s version_diff.txt ]]; then
            echo "manual_bump=true" >> $GITHUB_ENV
          else
            echo "manual_bump=false" >> $GITHUB_ENV
          fi

      - name: Bump Version (if not manual)
        if: env.manual_bump == 'false'
        id: bump-version
        run: |
          IFS='.' read -r major minor patch <<< "${{ env.current_version }}"
          patch=$((patch + 1))
          new_version="${major}.${minor}.${patch}"
          echo "new_version=$new_version" >> $GITHUB_ENV
          echo "$new_version" > version.txt

      - name: Commit New Version
        if: env.manual_bump == 'false'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add version.txt
          git commit -m "Bump version to ${{ env.new_version }}"
          git push origin main

  deploy:
    runs-on: ubuntu-latest
    needs: bump-version
    permissions:
      contents: write
      pages: write
      id-token: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Checkout gh-pages storage
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: .pages-storage
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy main site files into storage
        run: |
          rsync -av \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.pages-storage/' \
            --exclude='node_modules/' \
            ./ .pages-storage/

      - name: Commit and push storage to gh-pages
        run: |
          cd .pages-storage
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Deploy main site"
          git push origin gh-pages

      - name: Remove .git before upload
        run: rm -rf .pages-storage/.git

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-storage

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
